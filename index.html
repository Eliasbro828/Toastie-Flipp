<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><title>Toastie Flip – Toast-Spiel im Browser</title>
<meta name="description" content="Toastie Flip: Zieh, flippe und lande den Toast. Kostenloses Handy-Browserspiel mit 10 Leveln und Butterzilla-Bosskampf.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b2412;--card:#fff;--acc:#ff8a2a;--acc2:#e8651a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 30%,#8a5530,#4a2a16 55%,#1f1109);color:#fff;font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
#fx{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#fx span{position:absolute;top:0;opacity:.35;animation:rise linear infinite}
@keyframes rise{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-20vh) rotate(360deg)}}
.s{display:none;position:relative;min-height:100%;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;box-sizing:border-box;text-align:center}
.s.on{display:flex}
.logo{font-size:90px;line-height:1;animation:fl 2.6s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
@keyframes fl{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-16px) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}
h1{margin:0;font-size:46px;letter-spacing:1px;text-shadow:0 4px 0 rgba(0,0,0,.25)}
h2{margin:0;font-size:30px;text-shadow:0 3px 0 rgba(0,0,0,.2)}
p{margin:0;opacity:.9}
.b{width:min(280px,80vw);font:700 22px system-ui;padding:16px;border:0;border-radius:18px;background:#fff;color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.25)}
.b.m{background:var(--acc);color:#fff;box-shadow:0 5px 0 var(--acc2)}
.b:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
#grid{display:grid;grid-template-columns:repeat(5,56px);gap:12px;margin:8px 0}
.lv{width:56px;height:56px;border:0;border-radius:16px;font:700 20px system-ui;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.lv.ok{background:#2eb85c;color:#fff}.lv.cur{background:#fff;color:#3b2412}.lv.todo{background:#b9b9b9;color:#7a7a7a}
#game{padding:0;justify-content:flex-start;background:#000}
#gw{position:relative;width:100%;max-width:480px}
canvas{display:block;width:100%;height:auto;aspect-ratio:3/4;max-height:100vh;touch-action:none}
#back{position:absolute;top:8px;left:8px;border:0;border-radius:12px;padding:6px 12px;background:rgba(255,255,255,.85);color:var(--ink);font:700 16px system-ui}
#coins{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:10;display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:12px;background:rgba(0,0,0,.55);color:#ffe27a;font:700 16px system-ui}
#coins i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a8,#e0a526);border:2px solid #b8791a;box-sizing:border-box}
#skgrid{display:grid;grid-template-columns:repeat(3,104px);gap:10px;justify-content:center}
.sk{width:104px;padding:8px 4px;border-radius:16px;background:rgba(255,255,255,.14);text-align:center;cursor:pointer}
.sk.sel{outline:3px solid #ffe27a}
.sk canvas{width:100%;height:auto;display:block}
.sk .nm{font-weight:700;margin-top:4px;font-size:15px}
.sk .pr{font-size:13px;opacity:.92;min-height:17px}
.cn{display:inline-block;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a8,#e0a526);border:2px solid #b8791a;box-sizing:border-box;margin-right:4px;vertical-align:-1px}
#snd{position:fixed;top:calc(46px + env(safe-area-inset-top,0px));right:8px;z-index:10;border:0;border-radius:12px;padding:6px 12px;background:rgba(255,255,255,.85);color:var(--ink);font:700 14px system-ui}
#win,#dead{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.6)}
#splash{position:fixed;inset:0;z-index:1000;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s;padding:24px;box-sizing:border-box}
#splash img{width:min(86vw,520px);height:auto;display:block}
#pl{width:min(70vw,360px);height:5px;background:#2a1400;border-radius:3px;overflow:hidden}
#pb{height:100%;width:0;background:linear-gradient(90deg,#c44a00,#ffb02e);box-shadow:0 0 12px #ff8a1f}
#pp{color:#fff;font:700 14px system-ui;letter-spacing:1px}
#game{position:fixed;inset:0;z-index:5;background:#000;padding:0;justify-content:center;align-items:center;min-height:0}
#gw{width:min(100vw,75vh);max-width:none}
@supports(height:100dvh){#gw{width:min(100vw,75dvh)}}
#c{width:100%;height:auto;max-height:none}
body.play #fx{display:none}
#upd{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);text-align:center;padding:6px 16px 7px;border-radius:14px;background:rgba(0,0,0,.45);border:1px solid rgba(255,214,90,.45);box-shadow:0 0 14px rgba(255,190,50,.25);white-space:nowrap}
#ul{font:800 11px system-ui;letter-spacing:3px;text-transform:uppercase;color:#ffd75e}
#ut{font:800 17px system-ui;color:#fff;font-variant-numeric:tabular-nums;margin-top:2px}
body.hw{background:radial-gradient(ellipse at 50% 28%,#53267a,#26113c 55%,#0c0516)}
#upd{background:linear-gradient(#2a1040,#12061f);border:1.5px solid #ff8a1f;box-shadow:0 0 16px rgba(255,140,30,.6);animation:flick 2.4s ease-in-out infinite;padding:5px 14px 8px}
#ul{font:400 20px 'Creepster','Chiller','Papyrus',fantasy;letter-spacing:4px;color:#ff9a2a;text-shadow:0 0 8px rgba(255,140,30,.9),0 2px 0 #4a1c00;display:flex;align-items:center;justify-content:center;gap:8px}
#ul svg{filter:drop-shadow(0 0 4px #ff9a1f)}
#ut{font:800 16px system-ui;color:#ffd08a;text-shadow:0 0 8px rgba(255,140,30,.8);margin-top:1px}
@keyframes flick{0%,100%{box-shadow:0 0 12px rgba(255,140,30,.45)}45%{box-shadow:0 0 24px rgba(255,150,30,.95)}60%{box-shadow:0 0 16px rgba(255,140,30,.6)}}
@keyframes rise2{from{transform:translateY(110vh) rotate(-8deg)}50%{transform:translateY(40vh) rotate(8deg)}to{transform:translateY(-20vh) rotate(-8deg)}}
#web{position:fixed;top:0;left:0;width:120px;height:120px;pointer-events:none;opacity:.5}
body.play #web{display:none}
#hwb{background:linear-gradient(#ff9a2a,#c4480a);color:#fff;border:1.5px solid #ffd08a;box-shadow:0 0 16px rgba(255,140,30,.6);text-shadow:0 1px 0 #6a2200}
.sk{position:relative}
.lim{position:absolute;top:5px;right:5px;background:rgba(0,0,0,.65);color:#ffd23a;font:800 10px system-ui;padding:2px 7px;border-radius:9px;border:1px solid #ffd23a;letter-spacing:.5px;text-transform:uppercase}
.ar{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:60px;border-radius:14px;border:2px solid #ffd23a;background:rgba(0,0,0,.45);color:#ffd23a;font:800 30px system-ui;z-index:3}
#levels{padding-left:42px!important;padding-right:42px!important;padding-top:44px!important}
#hwt{position:absolute;top:8px;left:50%;transform:translateX(-50%);padding:4px 12px;border-radius:12px;background:rgba(0,0,0,.55);border:1px solid #ff8a1f;color:#ffb347;font:800 13px system-ui;white-space:nowrap;box-shadow:0 0 10px rgba(255,140,30,.5);z-index:3}
body:not(.hw) #web,body:not(.hw) .hwi,body:not(.hw) #hwb,body:not(.hw) #hwb2{display:none}
#upd2 .upc{background:linear-gradient(#2a1040,#12061f);border:2px solid #ff8a1f;border-radius:20px;padding:18px 16px;max-width:360px;width:100%;box-shadow:0 0 26px rgba(255,140,30,.6);color:#fff;text-align:left}
#upd2 h2{font:400 26px 'Creepster','Chiller',fantasy;color:#ff9a2a;text-align:center;margin:0 0 10px;text-shadow:0 0 10px rgba(255,140,30,.9)}
#upd2 li{list-style:none;margin:8px 0;padding-left:20px;position:relative;font:600 14px system-ui;opacity:0;animation:upin .5s forwards}
#upd2 li:before{content:'';position:absolute;left:0;top:5px;width:10px;height:10px;border-radius:50%;background:#ff8a1f;box-shadow:0 0 6px #ff8a1f}
@keyframes upin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#upd2 li.c{padding-left:0}#upd2 li.c:before{display:none}#upd2 .upc{min-height:220px}
.lim.ult{color:#ff5a5a;border-color:#ff5a5a}.skh{width:100%;grid-column:1/-1;flex:0 0 100%;color:#ffd23a;font:800 15px system-ui;margin:6px 0 2px;text-align:left}
#hwb2{background:linear-gradient(#b01020,#5a0610);color:#fff;border:1.5px solid #ff5a5a;box-shadow:0 0 16px rgba(255,40,40,.6)}
#home .logo{display:none}
</style></head><body>
